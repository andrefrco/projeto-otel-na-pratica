receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  otlphttp/external:
    endpoint: ${env:EXTERNAL_OTLP_ENDPOINT:-http://external-collector:4318}
    compression: zstd
    headers:
      Authorization: "Bearer ${env:EXTERNAL_OTLP_TOKEN:-}"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/external]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/external]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/external]
